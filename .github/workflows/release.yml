# Publishes a release with wp-media-usage.zip for every "vX.Y.Z" tag; sites with the plugin then see the update
# (includes/class-wmu-updates.php). Only once the tests (tests.yml) have passed for that tag: otherwise no release.
name: Release

on:
  push:
    tags:
      - 'v*'

# To publish the release. The actions are pinned to a commit (their tag in a comment): what runs with this right never
# changes behind our back.
permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K\S+' wp-media-usage.php)
          constant=$(grep -m1 -oP "define\('WMU_VERSION', '\K[^']+" wp-media-usage.php)
          stable=$(grep -m1 -oP '^Stable tag:\s*\K\S+' readme.txt)
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag, Version $header, WMU_VERSION $constant and readme.txt Stable tag $stable must match."
            exit 1
          fi

      # git archive leaves out what .gitattributes marks export-ignore (dev files).
      - name: Build wp-media-usage.zip
        run: |
          mkdir build
          git archive --format=tar --prefix=wp-media-usage/ HEAD | tar -x -C build
          cd build
          zip -qr ../wp-media-usage.zip wp-media-usage

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: wp-media-usage.zip
          generate_release_notes: true
